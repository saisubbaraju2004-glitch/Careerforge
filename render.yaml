services:
  - type: web
    name: careerforge-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - fromGroup: careerforge-production
      - key: FLASK_DEBUG
        value: "False"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: careerforge-db
          property: connectionString

databases:
  - name: careerforge-db
    databaseName: careerforge
    user: careerforge
    plan: basic-256mb
