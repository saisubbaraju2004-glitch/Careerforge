services:
  - type: web
    name: CareerForge
    runtime: python
    plan: starter
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - fromGroup: careerforge-production
      - key: FLASK_DEBUG
        value: "False"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL
        sync: false
